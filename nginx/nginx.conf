events {}
http {
    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /oauth/ {
            proxy_pass http://fastapi:8000/oauth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /client/ {
            proxy_pass http://fastapi:8000/client/;
            proxy_set_header Host $host;
        }

        location /account/ {
            proxy_pass http://fastapi:8000/account/;
            proxy_set_header Host $host;
        }

        location /deposit/ {
            proxy_pass http://fastapi:8000/deposit/;
            proxy_set_header Host $host;
        }
    }
}